<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VTS Hotkey Player (Eel)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
    <script defer src="main.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>VTS Hotkey Player</h1>
    </header>

    <div class="control-panel">
        <div class="file-group">
            <button onclick="pickAudio()">音声ファイル選択</button>
            <span id="audio-path-display">未選択</span>
        </div>
        <div class="file-group">
             <button onclick="saveBundle()">Bundle保存</button>
             <button onclick="loadBundle()">Bundle読み込み</button>
        </div>
    </div>

    <div class="main-content">
        <div class="timeline-editor">
            <div class="table-header">
                <span>Time (sec)</span>
                <span>Type</span>
                <span>Key / Data</span>
                <span>Action</span>
            </div>
            <div id="event-list" class="event-list">
                </div>
            
            <div class="input-row">
                <input type="number" id="in-time" step="0.1" placeholder="秒数">
                <select id="in-type" onchange="toggleInput()">
                    <option value="press">キー押下</option>
                    <option value="pause">一時停止</option>
                </select>
                <input type="text" id="in-key" placeholder="キー (1, F1, a...)">
                <button class="btn-add" onclick="addEvent()">追加</button>
            </div>
        </div>

        <div class="log-panel">
            <h3>Log</h3>
            <div id="log-box"></div>
        </div>
    </div>

    <footer class="player-bar">
        <div id="waveform-container" class="player-waveform">
            <div id="waveform"></div>
            <div id="waveform-loading">Loading...</div>
        </div>

        <div class="player-controls">
            <div class="control-left">
                <input type="number" id="start-offset" value="0" class="input-minimal" placeholder="Start sec">
            </div>

            <div class="control-center">
                <div id="btn-toggle" class="play-toggle" onclick="togglePlayback()">
                    <svg id="icon-play" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </div>
            </div>

            <div class="control-right">
                <div id="time-display" class="time-display">00:00.000</div>
            </div>
        </div>
    </footer>
</div>

</body>
</html>
