<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VTS Hotkey Player (Eel)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
    <script defer src="main.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>VTS Hotkey Player</h1>
    </header>

    <div class="control-panel">
        <div class="file-group">
            <button onclick="pickAudio()">音声ファイル選択</button>
            <span id="audio-path-display">未選択</span>
        </div>
        <div class="file-group">
             <button onclick="saveBundle()">Bundle保存</button>
             <button onclick="loadBundle()">Bundle読み込み</button>
        </div>
    </div>

    <div class="main-content">
        <div class="timeline-editor">
            <div class="table-header">
                <span>Time (sec)</span>
                <span>Type</span>
                <span>Key / Data</span>
                <span>Action</span>
            </div>
            <div id="event-list" class="event-list">
                </div>
            
            <div class="input-row">
                <input type="number" id="in-time" step="0.1" placeholder="秒数">
                <select id="in-type" onchange="toggleInput()">
                    <option value="press">キー押下</option>
                    <option value="pause">一時停止</option>
                </select>
                <input type="text" id="in-key" placeholder="キー (1, F1, a...)">
                <button class="btn-add" onclick="addEvent()">追加</button>
            </div>
        </div>

        <div class="log-panel">
            <h3>Log</h3>
            <div id="log-box"></div>
        </div>
    </div>

    <footer>
        <div class="playback-controls">
            <div id="waveform-container" style="background: #111; border-radius: 4px; margin-bottom: 10px; position: relative;">
                <div id="waveform"></div>
                <div id="waveform-loading" style="color: #888; text-align: center; padding: 10px; display: none;">
                    Loading Waveform...
                </div>
            </div>

            <input type="number" id="start-offset" value="0" style="width: 60px;"> 秒から
            <button id="btn-play" class="btn-play" onclick="startPlayback()">▶ 再生</button>
            <button id="btn-stop" class="btn-stop" onclick="stopPlayback()" disabled>■ 停止</button>
        </div>
        <div id="time-display">00:00.000</div>
    </footer>
</div>

</body>
</html>
