<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VTS Hotkey Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/timeline.min.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
    <script defer src="main.js"></script>
</head>
<body>
    <div id="modal-settings" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>設定</h3>
            <div class="settings-body">
                <div class="setting-row">
                    <div class="setting-label">
                        <span>キー押下時間 (秒)</span>
                        <small>VTSが反応しない時は長くするのですの</small>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="set-duration" min="0.01" max="0.3" step="0.01" value="0.08" oninput="updateSettings('duration')">
                        <span id="val-duration">0.08s</span>
                    </div>
                </div>

                <div class="setting-row">
                    <div class="setting-label">
                        <span>スキップ時間 (秒)</span>
                        <small>ボタンを押した時の移動量</small>
                    </div>
                    <div class="setting-control">
                        <input type="number" id="set-skip" min="1" max="60" value="10" class="input-dark" onchange="updateSettings('skip')">
                    </div>
                </div>

                <div class="setting-row">
                    <div class="setting-label">
                        <span>マスター音量</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="set-volume" min="0" max="1" step="0.05" value="1.0" oninput="updateSettings('volume')">
                        <span id="val-volume">100%</span>
                    </div>
                </div>

                <div class="setting-row">
                    <div class="setting-label">
                        <span>オートスクロール</span>
                        <small>再生に合わせて画面を動かすか</small>
                    </div>
                    <div class="setting-control">
                        <label class="toggle-switch">
                            <input type="checkbox" id="set-autoscroll" onchange="updateSettings('autoscroll')">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="modal-buttons" style="justify-content: flex-end; margin-top: 20px;">
                <button class="btn-cancel" onclick="closeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>読み込み中...</p>
        </div>
    </div>
<div class="container">
    <header>
        <h1>VTS Hotkey Player <small id="version-label" style="font-size:0.6rem; color:#888;"></small></h1>
        
        <div style="display:flex; gap:10px; align-items:center;">
            
            <button class="btn-settings" onclick="checkUpdate()" title="アップデートを確認" 
                    style="width: auto; border-radius: 6px; padding: 5px 10px; gap: 6px; transform: none !important;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
                </svg>
                <span style="font-size:0.85rem; font-weight:normal;">更新確認</span>
            </button>

            <button class="btn-settings" onclick="openSettingsModal()" title="設定">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="control-panel">
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="pickAudio()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span>音声を選択する</span>
            </button>
            <div id="audio-status" class="file-status" title="未選択">
                未選択
            </div>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="loadBundle()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>バンドル読込</span>
            </button>
            <button id="btn-save" class="toolbar-btn" onclick="saveBundle()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                <span>バンドル保存</span>
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="timeline-editor">
            <div class="table-header">
                <span>Time (sec)</span>
                <span>Type</span>
                <span>Key / Data</span>
                <span>Action</span>
            </div>
            <div id="event-list" class="event-list">
                </div>
            
            <div class="input-row">
                <input type="number" id="in-time" step="0.1" placeholder="秒数">
                <select id="in-type" onchange="toggleInput()">
                    <option value="press">キー押下</option>
                    <option value="pause">一時停止</option>
                </select>
                <div id="in-key" class="hotkey-input" tabindex="0" data-placeholder="キーを押してください"></div>
                <button id="btn-add" class="btn-add" onclick="addEvent()">追加</button>
            </div>
        </div>

        <div class="log-panel">
            <h3>
                <span>Log</span>
                <button class="btn-clear-log" onclick="clearLog()" title="ログをクリア">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </h3>
            <div id="log-box"></div>
        </div>
    </div>

    <footer class="player-bar">
        <div id="waveform-container" class="player-waveform">
            <div id="waveform">
                <div id="wave-timeline"></div>
            </div>
            <div id="waveform-loading">(ここに波形が表示されます)</div>
        </div>

        <div class="player-controls">
            <div class="control-center">
                <button id="btn-skip-back" class="btn-skip" onclick="skipBackward()" title="10秒戻る">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
                    </svg>
                </button>

                <div id="btn-toggle" class="play-toggle" onclick="togglePlayback()">
                    <svg id="icon-play" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </div>

                <button id="btn-skip-fwd" class="btn-skip" onclick="skipForward()" title="10秒進む">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>
                    </svg>
                </button>
            </div>

            <div class="control-right">
                <div id="time-display" class="time-display">00.000s</div>
            </div>
        </div>
    </footer>
</div>



<div id="modal-event" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>イベントを追加</h3>
        <div class="input-group">
            <label>Time:</label>
            <input type="number" id="modal-time" step="0.01" readonly style="background:#333; border:none; color:#89b4fa; font-weight:bold;">
        </div>
        <div class="input-group">
            <label>Type:</label>
            <select id="modal-type" onchange="toggleModalInput()">
                <option value="press">キー押下</option>
                <option value="pause">一時停止</option>
            </select>
        </div>
        <div class="input-group">
            <label>Key:</label>
            <div id="modal-key" class="hotkey-input" tabindex="0" data-placeholder="キーを押してください"></div>
        </div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeEventModal()">キャンセル</button>
            <button class="btn-save" onclick="saveEventFromModal()">保存</button>
        </div>
    </div>
</div>


<div id="modal-update" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="width: 500px;">
        <h3>アップデート確認</h3>
        
        <p id="update-message" style="text-align: center; font-weight:bold; font-size:1.1rem; margin: 10px 0;">
            確認中...
        </p>

        <div id="version-compare-area" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1; background: #181825; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #444;">
                <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">現在のバージョン</div>
                <div id="disp-current-ver" style="font-size: 1.1rem; font-weight: bold; color: #e0e0e0;">-</div>
            </div>

            <div id="version-arrow" style="display: flex; align-items: center; color: #89b4fa; font-weight: bold; display: none;">
                →
            </div>

            <div style="flex: 1; background: #181825; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #444;">
                <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">最新バージョン</div>
                <div id="disp-latest-ver" style="font-size: 1.1rem; font-weight: bold; color: #89b4fa;">-</div>
            </div>
        </div>

        <div id="update-changelog" class="update-log" style="display:none;"></div>

        <div class="modal-buttons" style="justify-content: flex-end; gap: 10px;">
            <button class="btn-cancel" onclick="closeUpdateModal()">閉じる</button>
            <button id="btn-do-update" class="btn-save" onclick="executeUpdate()" style="display:none;">
                更新してVTS Hotkey Playerを再起動
            </button>
        </div>
    </div>
</div>


</body>
</html>
